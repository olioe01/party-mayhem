<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Party Mayhem – Játékképernyő</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0f0823; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: Fredoka, 'Trebuchet MS', sans-serif; }
    canvas { display: block; background: #1a0f3a; cursor: default; }
    #start {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, #4c1d95, #0f0823 70%); color: #fff; cursor: pointer; z-index: 5;
      text-align: center; gap: 12px;
    }
    #start h1 { font-size: clamp(40px, 8vw, 96px); margin: 0; letter-spacing: 2px; text-shadow: 0 6px 0 #ff4d6d, 0 12px 30px rgba(0,0,0,.5); }
    #start p { font-size: 22px; opacity: .85; margin: 0; }
    #start .btn { margin-top: 18px; padding: 16px 40px; border-radius: 999px; background: #ffd43b; color: #2b1055; font-size: 26px; font-weight: 700; box-shadow: 0 6px 0 #c59a00; }
    #start small { position: absolute; bottom: 18px; opacity: .55; font-size: 15px; }
    #msg { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: #ef4444; color: #fff; padding: 8px 18px; border-radius: 12px; font-size: 18px; display: none; z-index: 6; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="start">
    <h1>PARTY MAYHEM</h1>
    <p>Táblás partijáték – a telefonok a kontrollerek</p>
    <div class="btn">Kattints a kezdéshez</div>
    <small>F = teljes képernyő · M = hang ki/be</small>
  </div>
  <div id="msg"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/host/main.js"></script>
</body>
</html>
